<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img"><title>Faktor agihan: jumlah vektor voltan gegelung</title><rect width="760" height="440" fill="#ffffff"/><rect width="760" height="46" fill="#f1f5f9"/><rect width="6" height="46" fill="#0f766e"/><text x="22.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">Faktor agihan: jumlah vektor voltan gegelung</text><line x1="80.0" y1="300.0" x2="176.4" y2="185.1" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/><polygon points="176.4,185.1 173.1,196.6 165.6,190.3" fill="#dc2626"/><text x="112.2" y="230.5" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">E1</text><line x1="176.4" y1="185.1" x2="202.1" y2="154.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="196.1" y="152.5" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">β = 20°</text><line x1="176.4" y1="185.1" x2="306.3" y2="110.1" stroke="#d97706" stroke-width="3.2" stroke-linecap="round"/><polygon points="306.3,110.1 299.3,119.8 294.4,111.3" fill="#d97706"/><text x="273.8" y="116.8" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">E2</text><line x1="306.3" y1="110.1" x2="341.0" y2="90.1" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="335.0" y="88.1" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">β = 20°</text><line x1="306.3" y1="110.1" x2="454.0" y2="84.0" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/><polygon points="454.0,84.0 444.1,90.8 442.4,81.1" fill="#2563eb"/><text x="417.1" y="78.6" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">E3</text><line x1="80.0" y1="300.0" x2="454.0" y2="84.0" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="9 6"/><polygon points="454.0,84.0 447.0,93.8 442.1,85.3" fill="#0f766e"/><text x="300.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#0f766e" text-anchor="start" font-weight="700">Jumlah vektor</text><rect x="498.0" y="150.0" width="240.0" height="132.0" rx="10" fill="#e0f2f1" stroke="#99d5cf" stroke-width="1"/><text x="512.0" y="176.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start">36 alur, 4 kutub, q = 3</text><text x="512.0" y="199.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Jumlah aritmetik = 3.00 E</text><text x="512.0" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Jumlah vektor = 2.88 E</text><text x="512.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="700">kd = 2.88 ÷ 3.00 = 0.960</text><text x="80.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Jumlah aritmetik (jika semua gegelung dalam satu alur)</text><rect x="80.0" y="360.0" width="450.0" height="14.0" rx="3" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="0"/><text x="80.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Jumlah vektor (gegelung diagih dalam 3 alur)</text><rect x="80.0" y="408.0" width="432.0" height="14.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="0"/></svg>
