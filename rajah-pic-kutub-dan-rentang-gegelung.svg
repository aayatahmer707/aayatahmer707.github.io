937" text-anchor="start">Pic kutub = S ÷ P = 9 alur</text><text x="498.0" y="378.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Alur per kutub per fasa, q = 3</text><text x="498.0" y="402.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start">Faktor pic = sin(7 ÷ 9 × 90°) = 0.940</text></svg>
