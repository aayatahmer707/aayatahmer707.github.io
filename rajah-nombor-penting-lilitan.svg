<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img"><title>Enam nombor penting dalam lilitan semula</title><rect width="760" height="400" fill="#ffffff"/><rect width="760" height="46" fill="#f1f5f9"/><rect width="6" height="46" fill="#0f766e"/><text x="22.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">Enam nombor penting dalam lilitan semula</text><rect x="30.0" y="70.0" width="220.0" height="140.0" rx="14" fill="#e0f2f1" stroke="#99d5cf" stroke-width="1.5"/><text x="140.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="700">4.44</text><text x="140.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Pemalar dalam formula</text><text x="140.0" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">voltan teraruh</text><rect x="270.0" y="70.0" width="220.0" height="140.0" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="380.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="700">120 f ÷ P</text><text x="380.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Laju segerak</text><text x="380.0" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">dalam psm</text><rect x="510.0" y="70.0" width="220.0" height="140.0" rx="14" fill="#e0f2f1" stroke="#99d5cf" stroke-width="1.5"/><text x="620.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="700">5 MΩ</text><text x="620.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Rintangan penebatan</text><text x="620.0" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">minimum pada 40 °C</text><rect x="30.0" y="230.0" width="220.0" height="140.0" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="140.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="700">0.30–0.45</text><text x="140.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Faktor isian alur</text><text x="140.0" y="342.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">bagi dawai bulat</text><rect x="270.0" y="230.0" width="220.0" height="140.0" rx="14" fill="#e0f2f1" stroke="#99d5cf" stroke-width="1.5"/><text x="380.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="700">370 °C</text><text x="380.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Suhu teras semasa</text><text x="380.0" y="342.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">membakar belitan lama</text><rect x="510.0" y="230.0" width="220.0" height="140.0" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="620.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#0f172a" text-anchor="middle" font-weight="700">10 °C</text><text x="620.0" y="324.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">Kenaikan suhu yang</text><text x="620.0" y="342.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">memendekkan hayat separuh</text></svg>
